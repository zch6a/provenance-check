<!doctype html>
<!-- The repository's social preview (1280×640): docs/social-preview.png, rendered from this page with headless Chrome
     (chrome --headless --screenshot --window-size=1280,640). The report is docs/report-tampered.png, a real screenshot
     of the report for a synthetic test image. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: radial-gradient(1100px 700px at 12% 8%, #1f2340 0%, #121320 55%, #0c0c13 100%); color: #e8e6e3;
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif; display: grid; grid-template-columns: 500px 1fr; gap: 40px;
    padding: 0 0 0 72px; box-sizing: border-box; align-items: center; }
  h1 { font-size: 56px; white-space: nowrap; margin: 0 0 18px; letter-spacing: -1.5px; }
  h1 span { color: #8fa8ff; }
  .tag { font-size: 32px; line-height: 1.25; margin: 0 0 24px; font-weight: 600; }
  .sub { font-size: 20px; line-height: 1.45; color: #b5b6c2; margin: 0 0 30px; }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; }
  .pills span { font-size: 16px; border: 1px solid #343852; background: #191b2b; border-radius: 999px; padding: 7px 14px; color: #d6d8e6; }
  .shot { align-self: center; height: 532px; overflow: hidden; border-radius: 14px 0 0 14px; border: 1px solid #2c2f44; border-right: none;
    box-shadow: 0 26px 70px rgba(0,0,0,.5); }
  .shot img { display: block; width: 760px; }
</style>
</head>
<body>
  <div>
    <h1>provenance-<span>check</span></h1>
    <p class="tag">Is this image AI-made?<br>Was it edited? Who signed it?</p>
    <p class="sub">Right-click an image and read its Content Credentials (C2PA) on your computer: in plain words, with what they do not prove. Nothing is uploaded.</p>
    <div class="pills"><span>Chrome &amp; Edge</span><span>Command line</span><span>Agent Skill</span><span>C2PA reference library</span></div>
  </div>
  <div class="shot"><img src="../docs/report-tampered.png" alt=""></div>
</body>
</html>
