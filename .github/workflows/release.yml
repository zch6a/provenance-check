name: Release
# On a version tag: test, build and zip the extension with a read-only token, then attach that zip to the GitHub
# release for the tag (made with the version's CHANGELOG section if it does not exist yet). The write token is only
# in the last job, which runs no project or dependency code: it downloads the tested zip and calls gh. Nothing is
# published anywhere else. Actions are pinned to commits (the tag each one was is in the comment).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # No install scripts: esbuild's binary comes in its platform package without them.
      - run: npm ci --ignore-scripts
      - name: The tag is the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run build
      - run: npm run zip
      # What is published is the zip, so the zip itself (unzipped, as a person would) is loaded into Chrome and checked
      # end to end; a runner without Chrome fails here instead of skipping.
      - name: The zip itself works in Chrome
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/unzipped"
          unzip -q "release/provenance-check-${GITHUB_REF_NAME#v}.zip" -d "$RUNNER_TEMP/unzipped"
          DIST="$RUNNER_TEMP/unzipped" node scripts/extension-e2e.mjs | tee "$RUNNER_TEMP/e2e.log"
          ! grep -q '^skip:' "$RUNNER_TEMP/e2e.log"
      - name: Release notes from the CHANGELOG
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="release/provenance-check-${version}.zip"
          test -f "$zip"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "provenance-check $version" --notes-file release/notes.md --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
